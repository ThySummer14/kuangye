name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build
        working-directory: app
        run: npm ci && npm test && npm run build
      - name: Check release assets
        run: npm run check:release
      - name: Check out the independent Godot lighting export
        uses: actions/checkout@v4
        with:
          ref: 4c1a0fa758e579e6bd83b8c4cf1c3df39b43b91d
          path: .godot-lighting-source
          sparse-checkout: godot-prototype/web
      - name: Verify and stage Godot lighting preview
        run: |
          cd .godot-lighting-source/godot-prototype/web
          sha256sum --check SHA256SUMS
          cd "$GITHUB_WORKSPACE"
          mkdir -p app/dist/godot-lighting
          cp -a .godot-lighting-source/godot-prototype/web/. app/dist/godot-lighting/
          rm app/dist/godot-lighting/.gdignore
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
